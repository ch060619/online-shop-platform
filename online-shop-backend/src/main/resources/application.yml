server:
  port: 8080

spring:
  profiles:
    active: sqlite
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.shop.domain.entity
  type-handlers-package: com.example.shop.repository.typehandler

shop:
  auth:
    token-secret: online-shop-demo-secret
    token-expire-seconds: 7200
