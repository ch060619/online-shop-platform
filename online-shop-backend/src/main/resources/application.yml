server:
  port: 8080

spring:
  profiles:
    active: sqlite
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.shop.domain.entity
  type-handlers-package: com.example.shop.repository.typehandler

shop:
  auth:
    token-secret: online-shop-demo-secret
    token-expire-seconds: 7200
    refresh-token-expire-seconds: 604800
  cache:
    product:
      detail-ttl-seconds: 600
      detail-ttl-random-seconds: 120
      list-ttl-seconds: 180
      list-ttl-random-seconds: 60
      null-ttl-seconds: 60
      preload-product-ids: 1,2,3
  idempotency:
    order:
      processing-ttl-seconds: 30
      success-ttl-seconds: 86400
  order:
    payment-timeout-minutes: 30
    timeout-scan-enabled: false
    timeout-scan-fixed-delay-millis: 60000
    timeout-scan-batch-size: 100
    rabbit-timeout-exchange: shop.order.timeout.exchange
    rabbit-timeout-delay-queue: shop.order.timeout.delay.queue
    rabbit-timeout-queue: shop.order.timeout.queue
    rabbit-timeout-delay-routing-key: shop.order.timeout.delay
    rabbit-timeout-routing-key: shop.order.timeout
